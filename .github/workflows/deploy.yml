name: Deploy to GitHub Pages

# Deploys public/ (the built PWA -- index.html, sw.js, manifest.json,
# icons/, CNAME) straight to GitHub Pages via Actions. There is no build
# step: the committed public/index.html is already the complete deployable
# artifact (see scripts/generate.js / handoff-prompt.md for how it's kept
# in sync with src/core/*.js and src/components/*.js before being
# committed).

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
