// ---------- Storage helpers (browser localStorage — data stays on this device/browser) ----------
const LS_PREFIX = "cricket-scorer:";
async function saveMatch(match) {
  try {
    localStorage.setItem(`${LS_PREFIX}match:${match.id}`, JSON.stringify(match));
    let idx = [];
    try {
      idx = JSON.parse(localStorage.getItem(`${LS_PREFIX}matches-index`) || "[]");
    } catch (e) {
      idx = [];
    }
    idx = idx.filter(m => m.id !== match.id);
    idx.unshift({
      id: match.id,
      teamA: match.teamA,
      teamB: match.teamB,
      teamAId: match.teamAId || null,
      teamBId: match.teamBId || null,
      oversLimit: match.oversLimit,
      updatedAt: Date.now(),
      status: match.status
    });
    localStorage.setItem(`${LS_PREFIX}matches-index`, JSON.stringify(idx.slice(0, 50)));
  } catch (e) {
    console.error("save failed", e);
  }
}
async function loadIndex() {
  try {
    return JSON.parse(localStorage.getItem(`${LS_PREFIX}matches-index`) || "[]");
  } catch (e) {
    return [];
  }
}

  try {
    const raw = localStorage.getItem(`${LS_PREFIX}match:${id}`);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
async function deleteMatch(id) {
  try {
    localStorage.removeItem(`${LS_PREFIX}match:${id}`);
    let idx = [];
    try {
      idx = JSON.parse(localStorage.getItem(`${LS_PREFIX}matches-index`) || "[]");
    } catch (e) {

  } catch (e) {
    console.error("delete failed", e);
  }
}
