      // against sharedMatches itself — see the Firestore rules comment on that collection. Not
      // awaited (scoring shouldn't wait on a secondary write), and retried on the next save if it
      // fails, since the dedup set only remembers success.
      if (match.tournamentId && !tournamentPointerWritten.has(match.id)) {
        tournamentPointerWritten.add(match.id);
        db.collection("tournamentMatches").doc(match.tournamentId).collection("entries").doc(match.id).set({
          tournamentId: match.tournamentId,
          matchId: match.id,
          shareCode: match.shareCode,
          updatedAt: Date.now()
        }).catch(e => {
          tournamentPointerWritten.delete(match.id);
          console.error("tournament match pointer write failed", e);
        });
      }
      return {
        ok: true,
        writeSeq: newSeq
      };
    } else if (auth.currentUser) {
      const ref = db.collection("users").doc(auth.currentUser.uid).collection("matches").doc(match.id);
      let newSeq;
      try {
        ({
          newSeq
        } = await transactionalMatchWrite(ref, match));
      } catch (e) {
        if (e.isConflict) {
          const remoteDoc = await ref.get();
          return {
            ok: false,
            conflict: true,
            remoteMatch: unpackMatchFromFirestore(remoteDoc.data())
          };
        }
        throw e;
      }
      upsertLocalPointer(match, {
        cloud: true
      });
      notifyLiveMatchSynced(match.id, newSeq);
      return {
        ok: true,
        writeSeq: newSeq
      };
    } else {
      const result = lsSetItem(`${LS_PREFIX}match:${match.id}`, JSON.stringify(match));
      if (!result.ok) {
        return {
          ok: false,
          error: result.error
        };
      }
      upsertLocalPointer(match, {
        cloud: false
      });
      return {
        ok: true
      };
    }
  } catch (e) {
    console.error("[saveMatch] threw —", match.shareCode ? "(match code)" : "(account)", "code:", e.code, "message:", e.message);
    // Still keep this device usable even when the cloud write fails, but a match-code save that
    // only lands in localStorage is actively misleading — nothing exists for another phone to
    // find — so this is surfaced as a real failure rather than silently treated as success. If
    // the local fallback save ALSO fails (e.g. the device's storage is full), that's strictly
    // worse than the original cloud error — nothing saved anywhere — so it takes over as the
    // reported error rather than being masked by whatever the original network/permission
    // failure said.
    const fallback = lsSetItem(`${LS_PREFIX}match:${match.id}`, JSON.stringify(match));
    if (fallback.ok) upsertLocalPointer(match, {
      cloud: false
    });
    return {
      ok: false,
      error: !fallback.ok ? fallback.error : e.code === "permission-denied" ? "Firestore rules aren't published yet for this project \u2014 see Firebase Console \u2192 Firestore Database \u2192 Rules." : e.message || "Couldn't reach the server."
    };
  }
}
// Public entry point. Saves the match to its primary location, queues it for automatic retry if
// that fails for a plain connectivity reason (queued writes are flushed on the 'online' event, a
// periodic timer, and opportunistically after any other successful save — see CricketScorer), and
// — entirely separately — mirrors it into /liveViews/{viewCode} if a view code has been issued for
// it. That mirror is a DIFFERENT document in a DIFFERENT collection from /sharedMatches/{shareCode},
// keyed by a DIFFERENT random code. That separation is the whole security model for read-only
// following: a view code can never resolve inside /sharedMatches, so it structurally cannot be
// used to gain scoring access, no matter what a viewer does with the link. See FollowScreen and
// the Firestore rules notes near genMatchCode() for the other half of this.
async function saveMatch(match) {
  const result = await savePrimaryMatch(match);
  if (result.ok) {
    clearPendingWrite(match.id);
    flushPendingWrites(); // opportunistic: we know the network just worked, catch up anything else
  } else if (!result.conflict) {
    queuePendingWrite(match);
  }
  if (match.viewCode) {
    try {
      await db.collection("liveViews").doc(match.viewCode).set(packMatchForFirestore({
        ...match,
        updatedAt: Date.now()
      }));
    } catch (e) {
      // Deliberately non-fatal: scoring must keep working even if the read-only mirror can't be
      // reached right now. Worst case a follower sees a stale score until the next ball updates it.
      console.error("[saveMatch] live-view mirror write failed \u2014 code:", e.code, "message:", e.message);
    }
  }
  return result;
}
// Plain (non-React-state-coupled) retry-once-on-conflict, for one-off administrative writes like
// revoking a code — there's no live scoring session to hand a resolution UI to here, and no
// genuine second writer to race, so adopting the server's actual sequence and retrying once is
// the right amount of care for this context. See saveTransition for the MatchScreen equivalent.
async function saveWithConflictRetry(match) {
  let result = await saveMatch(match);
  if (result.conflict && result.remoteMatch) {
    result = await saveMatch({
      ...match,
      writeSeq: result.remoteMatch.writeSeq
    });
  }
  return result;
}
// Revoking a code doesn't just stop working going forward — it deletes the document that code
// pointed at, so anyone still holding the old code gets a real "not found," not a code that quietly
// keeps failing. Clearing shareCode also moves the match's primary storage back to the account (or
// local device) on the next save, same as it would if a shareCode had never been set — revoking is
// really just "un-sharing," not a special state.
async function revokeShareCode(matchId) {
  const match = await loadMatch(matchId);
  if (!match || !match.shareCode) return {
    ok: false,
    error: "Couldn't find that match."
  };
  const oldCode = match.shareCode;
  const result = await saveWithConflictRetry({
    ...match,
    shareCode: null
  });
  if (!result.ok) return result;
  try {
    await db.collection("sharedMatches").doc(oldCode).delete();
  } catch (e) {
    console.error("revoke share code: delete failed", e);
  }
  if (match.tournamentId) {
    try {
      await db.collection("tournamentMatches").doc(match.tournamentId).collection("entries").doc(matchId).delete();
    } catch (e) {
      console.error("revoke share code: tournament pointer delete failed", e);
    }
  }
  return result;
}
async function revokeViewCode(matchId) {
  const match = await loadMatch(matchId);
  if (!match || !match.viewCode) return {
    ok: false,
    error: "Couldn't find that match."
  };
  const oldCode = match.viewCode;
  const result = await saveWithConflictRetry({
    ...match,
    viewCode: null
  });
  if (!result.ok) return result;
  try {
    await db.collection("liveViews").doc(oldCode).delete();
  } catch (e) {
    console.error("revoke view code: delete failed", e);
  }
  return result;
}
async function loadIndex() {
  const local = lsGetIndex();
  if (!auth.currentUser) return local;
  try {
    const snap = await db.collection("users").doc(auth.currentUser.uid).collection("matches").orderBy("updatedAt", "desc").limit(50).get();
    const cloud = snap.docs.map(d => ({
      ...d.data(),
      cloud: true
    }));
    const cloudIds = new Set(cloud.map(m => m.id));
    const localOnly = local.filter(m => !cloudIds.has(m.id)); // shared/guest matches this device knows about
    return [...cloud, ...localOnly].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 50);
  } catch (e) {
    console.error("cloud index load failed, showing local only", e);
    return local;
  }
}
async function loadMatch(id) {
  // A queued-but-not-yet-synced write is by definition newer than whatever's on the server —
  // reading it back here (instead of the network) is what stops a reload right as connectivity
  // returns, but before the next flush runs, from silently discarding balls that were scored
  // while offline. flushPendingWrites() (triggered elsewhere) will reconcile it with the server
  // shortly after; this function just needs to not present stale data as current in the meantime.
  const pendingRaw = localStorage.getItem(PENDING_PREFIX + id);
  if (pendingRaw) {
    try {
      return JSON.parse(pendingRaw);
    } catch (e) {
      /* fall through to normal load */
    }
  }
  const pointer = lsGetIndex().find(m => m.id === id);
  try {
    if (pointer && pointer.shareCode) {
      const doc = await db.collection("sharedMatches").doc(pointer.shareCode).get();
      if (doc.exists) return unpackMatchFromFirestore(doc.data());
    } else if ((pointer && pointer.cloud || !pointer) && auth.currentUser) {
      const doc = await db.collection("users").doc(auth.currentUser.uid).collection("matches").doc(id).get();
      if (doc.exists) return unpackMatchFromFirestore(doc.data());
    }
  } catch (e) {
    console.error("cloud load failed, trying local fallback", e);
  }
  const raw = localStorage.getItem(`${LS_PREFIX}match:${id}`);
  return raw ? JSON.parse(raw) : null;
}
async function fetchSharedMatch(code) {
  try {
    const doc = await db.collection("sharedMatches").doc(code).get({
      source: "server"
    });
    return doc.exists ? {
      found: true,
      match: unpackMatchFromFirestore(doc.data())
    } : {
      found: false
    };
  } catch (e) {
    console.error("[fetchSharedMatch] threw — code:", e.code, "message:", e.message);
    return {
      found: false,
      error: e.code === "permission-denied" ? "Firestore rules aren't published yet for this project \u2014 see Firebase Console \u2192 Firestore Database \u2192 Rules." : e.message || "Couldn't reach the server."
    };
  }
}
async function deleteMatch(id) {
  const pointer = lsGetIndex().find(m => m.id === id);
  try {
    if (pointer && pointer.shareCode) {
      await db.collection("sharedMatches").doc(pointer.shareCode).delete();
      if (pointer.tournamentId) {
        await db.collection("tournamentMatches").doc(pointer.tournamentId).collection("entries").doc(id).delete().catch(e => console.error("tournament pointer delete failed", e));
      }
    } else if ((!pointer || pointer.cloud) && auth.currentUser) {
      await db.collection("users").doc(auth.currentUser.uid).collection("matches").doc(id).delete();
    }
  } catch (e) {
    console.error("cloud delete failed", e);
  }
  if (pointer && pointer.viewCode) {
    try {
      await db.collection("liveViews").doc(pointer.viewCode).delete();
    } catch (e) {
      console.error("live-view delete failed", e);
    }
  }
  try {
    localStorage.removeItem(`${LS_PREFIX}match:${id}`);
    lsSetIndex(lsGetIndex().filter(m => m.id !== id));
  } catch (e) {
    console.error("local delete failed", e);
  }
  clearUndoHistory(id);
}
// ---------- Undo history (per-match, device-local) ----------
// The undo stack (MatchScreen's `history`) is a list of full match snapshots taken before each
// ball, kept ONLY in React state — so a tab refresh mid-match wiped it, leaving no way to correct
// a mis-scored ball (undo button just showed disabled, even though the match itself was fine and
// fully saved). This mirrors it into localStorage on every push/pop so it survives a refresh.
// Deliberately local-only, not synced to Firestore: undo is a same-device "oops, fix the last
// few balls" tool, not something that needs to follow the match across devices, and capping the
// depth (see MAX_UNDO_HISTORY below) keeps it bounded regardless of how long the innings runs.
const MAX_UNDO_HISTORY = 30;
function undoHistoryKey(matchId) {
  return `${LS_PREFIX}undoHistory:${matchId}`;
}
function loadUndoHistory(matchId) {
  try {
    return JSON.parse(localStorage.getItem(undoHistoryKey(matchId)) || "[]");
  } catch (e) {
    return [];
  }
}
function saveUndoHistory(matchId, history) {
  const result = lsSetItem(undoHistoryKey(matchId), JSON.stringify(history));
  if (!result.ok) console.error("save undo history failed", result.error);
}
function clearUndoHistory(matchId) {
  try {
    localStorage.removeItem(undoHistoryKey(matchId));
  } catch (e) {
    /* noop */
  }
}

// ---------- Players (shared cross-club directory, keyed by email) ----------
// A roster entry is still just {name, number} by default — nothing here is required. Giving a
// player an email and publishing them (via publishPlayer) creates a shared /players/{email} doc
// so the SAME person resolves consistently no matter which club's roster references them, and
// other clubs can borrow them into their own rosters via loadPublicPlayers. See firestore.rules
// for the full permission model (home club administers; auto-links to an account on sign-in).
function normalizeEmail(email) {
  return (email || "").trim().toLowerCase();
}
// Publishes a player (creates the shared doc if this is the first time anyone has, or just
// returns the existing one otherwise — deliberately doesn't overwrite an already-published
// player's name/homeClubId, since whichever club got there first keeps administering them).
async function publishPlayer(homeClubId, name, email, info) {
  const id = normalizeEmail(email);
  if (!id || !id.includes("@")) return {
    ok: false,
    error: "Enter a valid email to make this player public."
  };
  try {
    const ref = db.collection("players").doc(id);
    const existing = await ref.get();
    if (existing.exists) {
      return {
        ok: true,
        player: {
          id: existing.id,
          ...existing.data()
        }
      };
    }
    const player = {
      email: id,
      name: (name || "").trim(),
      homeClubId,
      public: true,
      linkedUid: null,
      age: info && info.age || null,
      role: info && info.role || null,
      battingHand: info && info.battingHand || null,
      bowlingHand: info && info.bowlingHand || null,
      createdAt: Date.now()
    };
    await ref.set(player);
    return {
      ok: true,
      player: {
        id,
        ...player
      }
    };
  } catch (e) {
    console.error("publish player failed", e.code, e.message);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only that player's home club owner can publish them." : e.message || "Couldn't make this player public."
    };
  }
}
// Owner-only (enforced by rules) — editing name/age/role/hand on an already-published player,
// without touching public/homeClubId/linkedUid. Separate from publishPlayer since re-publishing
// an existing player is a no-op by design (see the "already exists" branch above) — this is the
// actual edit path once a player has a doc.
async function updatePlayerInfo(email, info) {
  const id = normalizeEmail(email);
  try {
    await db.collection("players").doc(id).update({
      name: info.name,
      age: info.age || null,
      role: info.role || null,
      battingHand: info.battingHand || null,
      bowlingHand: info.bowlingHand || null
    });
    return {
      ok: true
    };
  } catch (e) {
    console.error("update player info failed", e.code, e.message);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only that player's home club owner can edit them." : e.message || "Couldn't update this player."
    };
  }
}
// Owner-only (enforced by rules) — takes a player back out of the cross-club directory without
// deleting them, so existing rosters that already reference this email keep working.
async function unpublishPlayer(email) {
  const id = normalizeEmail(email);
  try {
    await db.collection("players").doc(id).update({
      public: false
    });
    return {
      ok: true
    };
  } catch (e) {
    console.error("unpublish player failed", e.code, e.message);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only that player's home club owner can unpublish them." : e.message || "Couldn't update this player."
    };
  }
}
// Owner-only (enforced by rules) — a real, permanent delete, unlike unpublishPlayer. Safe to offer
// alongside that softer option: career stats are computed fresh from match data each time (see
// computePlayerCareerStats), never stored on this doc, so nothing historical is lost. Any other
// club's roster that borrowed this player keeps its own local copy of name/number regardless (see
// isBorrowed in TeamEditScreen) — they just won't be able to find or re-borrow this player again.
async function deletePlayer(email) {
  const id = normalizeEmail(email);
  try {
    await db.collection("players").doc(id).delete();
    return {
      ok: true
    };
  } catch (e) {
    console.error("delete player failed", e.code, e.message);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only that player's home club owner can delete them." : e.message || "Couldn't delete this player."
    };
  }
}
// The cross-club "borrow a player" directory — every player any club has published.
async function loadPublicPlayers() {
  try {
    const snap = await db.collection("players").where("public", "==", true).get();
    return snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));
  } catch (e) {
    console.error("load public players failed", e);
    return [];
  }
}
// Called once right after sign-in (see the auth effect in CricketScorer) — if a player doc
// already exists at this exact email and nobody's linked to it yet, attach it to this account.
// Silent no-op otherwise (no matching player, or already linked to someone) — this is a courtesy
// auto-link, not something the person asked for, so it never surfaces an error either way.
// Also denormalizes the signed-in person's Google account picture (if any) onto the player doc
// as photoURL, so the public player profile can show it without ever reading another account's
// private users/{uid} data (which nobody but that account can read — see firestore.rules). The
// rules only accept a photoURL that matches this exact auth token's own picture claim, so this
// can never attach an arbitrary image to someone else's player doc.
async function linkPlayerIfMatch(uid, email, photoURL) {
  const id = normalizeEmail(email);
  if (!id) return;
  try {
    const ref = db.collection("players").doc(id);
    const doc = await ref.get();
    if (doc.exists && !doc.data().linkedUid) {
      const update = {
        linkedUid: uid
      };
      if (photoURL) update.photoURL = photoURL;
      await ref.update(update);
    }
  } catch (e) {
    console.error("auto-link player failed", e.code, e.message);
  }
}

// ---------- Clubs (shared team rosters) ----------
// A club is a Firestore doc: /clubs/{clubId} = { name, description?, ownerUid, coOwnerUids,
// memberUids, memberNames, createdAt }. Its teams live in /clubs/{clubId}/teams/{teamId} and its
// tournaments in /clubs/{clubId}/tournaments/{tournamentId}.
//
// Permission model (simplified): there is only ONE privileged tier — "owner" — which covers both
// the original creator (ownerUid) and anyone granted co-ownership (coOwnerUids). Owner and
// co-owner have identical rights; the only thing that distinguishes ownerUid is that it can never
// be removed except by deleting the club outright. Everyone else in memberUids is a plain member:
// they can be picked for rosters/scoring but cannot rename the club, edit its description, manage
// teams or tournaments, invite anyone, or remove members.
//
// Every invite in this app — becoming a member, or becoming a co-owner — is addressed to one
// specific email address (see inviteClubMemberByEmail/inviteClubCoOwnerByEmail below) and can
// only be redeemed by someone signed in as that exact email. This replaces the old anonymous
// "share this code with your team" pattern; a code is still what gets pasted in to redeem, but
// it's now bound to a person, not just a click.
function isClubOwner(club, uid) {
  return !!club && !!uid && (club.ownerUid === uid || (club.coOwnerUids || []).includes(uid));
}
async function loadClubs() {
  if (!auth.currentUser) return [];
  try {
    const snap = await db.collection("clubs").where("memberUids", "array-contains", auth.currentUser.uid).get();
    return snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));
  } catch (e) {
    console.error("clubs load failed", e);
    return [];
  }
}
async function createClub(name) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in to create a club."
  };
  const trimmed = (name || "").trim();
  if (!trimmed) return {
    ok: false,
    error: "Give the club a name."
  };
  try {
    const ref = db.collection("clubs").doc();
    const club = {
      name: trimmed,
      description: "",
      ownerUid: auth.currentUser.uid,
      memberUids: [auth.currentUser.uid],
      coOwnerUids: [],
      memberNames: {
        [auth.currentUser.uid]: auth.currentUser.displayName || auth.currentUser.email || "Member"
      },
      createdAt: Date.now()
    };
    await ref.set(club);
    return {
      ok: true,
      club: {
        id: ref.id,
        ...club
      }
    };
  } catch (e) {
    return {
      ok: false,
      error: e.message || "Couldn't create the club."
    };
  }
}

// Owner-only. Mints a time-limited invite addressed to one email. Whoever redeems it while signed
// in as that exact email is added to memberUids only — no ownership rights.
async function inviteClubMemberByEmail(clubId, email) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in first."
  };
  const cleaned = (email || "").trim().toLowerCase();
  if (!cleaned || !cleaned.includes("@")) return {
    ok: false,
    error: "Enter a valid email address."
  };
  try {
    const code = genMatchCode();
    const createdAt = Date.now();
    const expiresAt = createdAt + 7 * 24 * 60 * 60 * 1000; // 7 days
    await db.collection("clubJoinCodes").doc(code).set({
      clubId,
      email: cleaned,
      role: "member",
      createdBy: auth.currentUser.uid,
      createdAt,
      expiresAt
    });
    // Mirrors a lightweight summary onto the club doc itself so the owner can see and revoke
    // pending invites — clubJoinCodes disallows `list` (a stranger shouldn't be able to enumerate
    // invite codes), so this is the only way to show "who have I invited?" without that.
    await db.collection("clubs").doc(clubId).update({
      [`pendingInvites.${code}`]: {
        email: cleaned,
        role: "member",
        createdAt,
        expiresAt
      }
    }).catch(e => console.error("invite: pendingInvites mirror failed", e));
    return {
      ok: true,
      code,
      createdAt,
      expiresAt
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the club owner can invite others." : e.message || "Couldn't generate an invite code."
    };
  }
}
// Owner-only. Same as above but the redeemer becomes a co-owner (added to both memberUids and
// coOwnerUids) — the sole path onto coOwnerUids, same as club creation is the sole path onto
// ownerUid. There's no promote-an-existing-member-by-uid flow anymore: granting ownership always
// goes through the target's own verified email, whether or not they already happen to be a member.
async function inviteClubCoOwnerByEmail(clubId, email) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in first."
  };
  const cleaned = (email || "").trim().toLowerCase();
  if (!cleaned || !cleaned.includes("@")) return {
    ok: false,
    error: "Enter a valid email address."
  };
  try {
    const code = genMatchCode();
    const createdAt = Date.now();
    const expiresAt = createdAt + 7 * 24 * 60 * 60 * 1000;
    await db.collection("clubJoinCodes").doc(code).set({
      clubId,
      email: cleaned,
      role: "coOwner",
      createdBy: auth.currentUser.uid,
      createdAt,
      expiresAt
    });
    await db.collection("clubs").doc(clubId).update({
      [`pendingInvites.${code}`]: {
        email: cleaned,
        role: "coOwner",
        createdAt,
        expiresAt
      }
    }).catch(e => console.error("invite: pendingInvites mirror failed", e));
    return {
      ok: true,
      code,
      createdAt,
      expiresAt
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the club owner can invite a co-owner." : e.message || "Couldn't generate an invite code."
    };
  }
}
// Owner-only (any owner/co-owner of the club, same as every other club-level action — unlike
// federation invites, club invites aren't locked to whoever personally sent them). Deletes the
// join code itself, so it can never be redeemed after this, and drops it from the club's
// pendingInvites list.
async function revokeClubInvite(clubId, code) {
  try {
    await db.collection("clubJoinCodes").doc(code).delete();
    await db.collection("clubs").doc(clubId).update({
      [`pendingInvites.${code}`]: firebase.firestore.FieldValue.delete()
    });
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the club owner can revoke an invite." : e.message || "Couldn't revoke that invite."
    };
  }
}
// Redeems either kind of invite above. The code's own `role` field decides whether the caller
// lands in memberUids only, or in memberUids + coOwnerUids — the Firestore rule re-derives and
// checks the exact same thing server-side (see clubs/{clubId} update rule, branch B).
async function joinClubWithCode(code) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in to join a club."
  };
  const cleaned = (code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!cleaned) return {
    ok: false,
    error: "Enter a code."
  };
  try {
    const codeDoc = await db.collection("clubJoinCodes").doc(cleaned).get();
    if (!codeDoc.exists) return {
      ok: false,
      error: "That code doesn't match any club."
    };
    const {
      clubId,
      expiresAt,
      email
    } = codeDoc.data();
    if (expiresAt && expiresAt < Date.now()) return {
      ok: false,
      error: "That invite has expired \u2014 ask for a new one."
    };
    const myEmail = (auth.currentUser.email || "").toLowerCase();
    if (email && myEmail !== email) return {
      ok: false,
      error: "That invite is addressed to a different email address than the one you're signed in with."
    };
    // The Firestore rule re-checks this exact join code (its clubId, expiry, email, and role)
    // server-side before allowing the membership write — this client-side check is only for a
    // fast error message.
    await db.collection("clubs").doc(clubId).update({
      memberUids: firebase.firestore.FieldValue.arrayUnion(auth.currentUser.uid),
      [`memberNames.${auth.currentUser.uid}`]: auth.currentUser.displayName || auth.currentUser.email || "Member",
      joinCodeUsed: cleaned,
      [`pendingInvites.${cleaned}`]: firebase.firestore.FieldValue.delete()
    });
    const clubDoc = await db.collection("clubs").doc(clubId).get();
    return {
      ok: true,
      club: {
        id: clubDoc.id,
        ...clubDoc.data()
      }
    };
  } catch (e) {
    console.error("join club failed", e);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "That invite is no longer valid." : e.message || "Couldn't join that club."
    };
  }
}

// rule needs to read the club's own memberUids, which requires the club doc to still exist), so
// this has to happen before, not after, the club doc itself is removed.
async function deleteClub(clubId) {
  try {
    const clubDoc = await db.collection("clubs").doc(clubId).get();
    const federationIds = clubDoc.exists ? clubDoc.data().federationIds || [] : [];
    const snap = await db.collection("clubs").doc(clubId).collection("teams").get();
    await Promise.all([...snap.docs.map(d => d.ref.delete()), ...federationIds.map(async fedId => {
      const teamSnap = await db.collection("federations").doc(fedId).collection("teams").where("clubId", "==", clubId).get();
      await Promise.all(teamSnap.docs.map(d => d.ref.delete()));
    })]);
    await db.collection("clubs").doc(clubId).delete();
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the club owner can delete it." : e.message || "Couldn't delete the club."
    };
  }
}

// ---------- Federations ----------
// A federation (e.g. "DCF") is a light umbrella tag that clubs opt into via an email-locked
// invite — it owns no teams or matches of its own; it only republishes a read-only directory of
// {club, team name} pairs so any club sharing the same federation can pick another member club's
// team when building a tournament, without ever getting access to that club's matches,
// membership, or full roster. There's no Cloud Function doing this server-side, so every mutation
// that could affect the directory (team saved/deleted, club joins/leaves a federation, club
// renamed) re-syncs it from the client right after the primary write succeeds.
//
// Same simplified permission model as clubs: one privileged tier, "owner", covering both the
// creator (createdBy) and anyone granted co-ownership (coOwnerUids). Every invite — a club
// affiliating, or someone becoming a co-owner — is addressed to one email and only redeemable by
// that exact signed-in email.
function isFederationOwner(federation, uid) {
  return !!federation && !!uid && (federation.createdBy === uid || (federation.coOwnerUids || []).includes(uid));
}
async function createFederation(name) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in to create a federation."
  };
  const trimmed = (name || "").trim();
  if (!trimmed) return {
    ok: false,
    error: "Give the federation a name."
  };
  try {
    const ref = db.collection("federations").doc();
    const federation = {
      name: trimmed,
      description: "",
      createdBy: auth.currentUser.uid,
      ownerName: auth.currentUser.displayName || auth.currentUser.email || "",
      coOwnerUids: [],
      kickedClubIds: [],
      createdAt: Date.now()
    };
    await ref.set(federation);
    return {
      ok: true,
      federation: {
        id: ref.id,
        ...federation
      }
    };
  } catch (e) {
    return {
      ok: false,
      error: e.message || "Couldn't create the federation."
    };
  }
}
async function loadFederationsByIds(ids) {
  if (!ids || ids.length === 0) return [];
  try {
    const docs = await Promise.all(ids.map(id => db.collection("federations").doc(id).get()));
    return docs.filter(d => d.exists).map(d => ({

// Owner-only. Mints an invite addressed to one email — whoever redeems it (signed in as that
// exact email, on behalf of one of their own clubs) affiliates that club with the federation.
async function inviteFederationByEmail(federationId, email) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in first."
  };
  const cleaned = (email || "").trim().toLowerCase();
  if (!cleaned || !cleaned.includes("@")) return {
    ok: false,
    error: "Enter a valid email address."
  };
  try {
    const code = genMatchCode();
    const createdAt = Date.now();
    await db.collection("federationJoinCodes").doc(code).set({
      federationId,
      email: cleaned,
      createdBy: auth.currentUser.uid,
      createdAt
    });
    // Best-effort mirror for the pending-invites list (see inviteClubMemberByEmail for why).
    // Unlike a club invite, redeeming this one writes only to the CLUB doc (see
    // joinFederationWithCode) — this app never lets one club's write touch another document it
    // doesn't own — so this entry can't auto-clear on redemption the way club/co-owner invites
    // do. It's cleared by an explicit revoke, or just ages out past expiresAt in the UI.
    await db.collection("federations").doc(federationId).update({
      [`pendingInvites.${code}`]: {
        kind: "club",
        email: cleaned,
        createdAt
      }
    }).catch(e => console.error("invite: pendingInvites mirror failed", e));
    return {
      ok: true,
      code,
      createdAt
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the federation owner can invite a club." : e.message || "Couldn't generate an invite code."
    };
  }
}
// A CLUB affiliates with a federation (not a user) — clubId picks which of the caller's clubs is
// joining, and the caller must be signed in as the exact email the invite was addressed to. Bulk-
// mirrors that club's existing teams into the federation's directory immediately, so other member
// clubs see them right away instead of waiting for each team to be re-saved.
async function joinFederationWithCode(clubId, code) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in to affiliate a club."
  };
  const cleaned = (code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!cleaned) return {
    ok: false,
    error: "Enter a code."
  };
  try {
    const codeDoc = await db.collection("federationJoinCodes").doc(cleaned).get();
    if (!codeDoc.exists) return {
      ok: false,
      error: "That code doesn't match any federation."
    };
    const {
      federationId,
      email
    } = codeDoc.data();
    const myEmail = (auth.currentUser.email || "").toLowerCase();
    if (email && myEmail !== email) return {
      ok: false,
      error: "That invite is addressed to a different email address than the one you're signed in with."
    };
    const fedDoc = await db.collection("federations").doc(federationId).get();
    if (!fedDoc.exists) return {
      ok: false,
      error: "That federation no longer exists."
    };
    await db.collection("clubs").doc(clubId).update({
      federationIds: firebase.firestore.FieldValue.arrayUnion(federationId)
    });
    await mirrorClubTeamsIntoFederation(clubId, federationId);
    return {
      ok: true,
      federation: {
        id: fedDoc.id,
        ...fedDoc.data()
      }
    };
  } catch (e) {
    console.error("join federation failed", e);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the club owner can affiliate it." : e.message || "Couldn't join that federation."
    };
  }
}

// ---------- Discoverability: public club/federation directories, and the request workflow that
// replaces the old federationJoinCodes email/code flow (see firestore.rules for the full model).

// Owner-only. Flips a club's discoverability. A public club mirrors a lightweight entry (name +
// owner name only, never the roster) into /clubDirectory so a federation owner can find it by
// search; the mirror is deleted the moment the club goes private again.
async function setClubVisibility(clubId, isPublic) {
  try {
    await db.collection("clubs").doc(clubId).update({
      visibility: isPublic ? "public" : "private"
    });
    if (isPublic) {
      const clubDoc = await db.collection("clubs").doc(clubId).get();
      const club = clubDoc.data() || {};
      await db.collection("clubDirectory").doc(clubId).set({
        clubId,
        name: club.name || "",
        ownerName: (club.memberNames || {})[club.ownerUid] || "",
        updatedAt: Date.now()
      });
    } else {
      await db.collection("clubDirectory").doc(clubId).delete().catch(e => console.error("clubDirectory delete failed", clubId, e));
    }
    return {
      ok: true
    };
  } catch (e) {
    console.error("setClubVisibility failed", clubId, isPublic, e);
    return {
      ok: false,
      error: e.code === "permission-denied" ? "Only the club owner can change this." : e.message || "Couldn't update visibility."
    };
  }
}

// Club owner requesting to join a PUBLIC federation, or a federation owner inviting a PUBLIC
// club — direction is "club_to_federation" or "federation_to_club". Only ever creates one pending
// request; see firestore.rules for who's allowed to accept/decline/cancel it.
async function requestFederationAffiliation(direction, clubId, federationId) {
  if (!auth.currentUser) return {
    ok: false,
    error: "Sign in first."
  };
  try {
    const ref = db.collection("federationRequests").doc();
    const reqDoc = {
      direction,
      clubId,
      federationId,
      status: "pending",
      fromUid: auth.currentUser.uid,
      fromName: auth.currentUser.displayName || auth.currentUser.email || "",
      createdAt: Date.now()
    };
    await ref.set(reqDoc);
    return {
      ok: true,
      request: {
        id: ref.id,
        ...reqDoc
      }
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "That club or federation isn't public any more, or you don't have permission." : e.message || "Couldn't send that request."
    };
  }
}
// Receiving side accepts or declines a pending request. Accepting a federation_to_club request
// (I'm the club owner) finishes the join immediately, since I already have full write access to
// my own club's federationIds. Accepting a club_to_federation request (I'm the federation owner)
// only flips status — the requesting club's own owner completes the join, see
// completeAcceptedFederationRequest.
async function respondFederationRequest(requestId, accept) {
  try {
    const reqSnap = await db.collection("federationRequests").doc(requestId).get();
    if (!reqSnap.exists) return {
      ok: false,
      error: "That request no longer exists."
    };
    const reqData = reqSnap.data();
    await db.collection("federationRequests").doc(requestId).update({
      status: accept ? "accepted" : "declined",
      respondedAt: Date.now()
    });
    if (accept && reqData.direction === "federation_to_club") {
      await db.collection("clubs").doc(reqData.clubId).update({
        federationIds: firebase.firestore.FieldValue.arrayUnion(reqData.federationId)
      });
      await mirrorClubTeamsIntoFederation(reqData.clubId, reqData.federationId);
    }
    return {
      ok: true,
      federationId: reqData.federationId,
      clubId: reqData.clubId
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "You can't respond to that request." : e.message || "Couldn't respond to that request."
    };
  }
}
// Sending side cancels their own still-pending request.
async function cancelFederationRequest(requestId) {
  try {
    await db.collection("federationRequests").doc(requestId).update({
      status: "cancelled",
      respondedAt: Date.now()
    });
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      error: e.code === "permission-denied" ? "You can't cancel that request." : e.message || "Couldn't cancel that request."
    };
  }
}
// The club owner's side of finishing an ACCEPTED club_to_federation request — see the big comment
// on /federationRequests in firestore.rules for why this is a separate step from the federation
// owner's accept.
async function completeAcceptedFederationRequest(requestId, clubId, federationId) {
  try {
    await db.collection("clubs").doc(clubId).update({
      federationIds: firebase.firestore.FieldValue.arrayUnion(federationId)
    });
    await mirrorClubTeamsIntoFederation(clubId, federationId);
    await db.collection("federationRequests").doc(requestId).update({
      status: "joined"
    });
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      error: e.message || "Couldn't complete that join."
    };
  }
}
// Loads every federationRequests row touching a club or federation I own/co-own — used for both
// the notification badge count and the Requests inbox. `clubIds`/`federationIds` are the caller's
// own owned/co-owned ids (Firestore 'in' tops out at 10, generous for how many clubs/federations
// one person realistically owns/co-owns).
async function loadMyFederationRequests(clubIds, federationIds) {
  if (!auth.currentUser) return [];
  try {
    const queries = [];
    if (clubIds && clubIds.length) {
      queries.push(db.collection("federationRequests").where("clubId", "in", clubIds.slice(0, 10)).get());
    }
    if (federationIds && federationIds.length) {
      queries.push(db.collection("federationRequests").where("federationId", "in", federationIds.slice(0, 10)).get());
    }
    if (!queries.length) return [];
    const snaps = await Promise.all(queries);
    const seen = new Map();
    snaps.forEach(snap => snap.docs.forEach(d => seen.set(d.id, {
      id: d.id,
      ...d.data()
    })));
    return Array.from(seen.values());
  } catch (e) {
    console.error("requests load failed", e);
    return [];
  }
}

// Standard cricket points-table math: 2 for a win, 1 each for a tie or no-result, 0 for a loss.
// If a tied match has a linked Super Over (match.superOverMatchId), points follow the Super Over's
// winner instead — the real convention is that the Super Over decides the match, but NRR still
// uses the ORIGINAL tied innings, not the one-over shootout, since NRR is meant to reflect
// tournament-long batting/bowling strength, not a coin-flip-adjacent single over.
// allMatches must include every match in the tournament AND any linked Super Over matches (the
// caller is responsible for fetching those; this function doesn't do its own Firestore reads).
// Fetches every full match doc tagged with this tournament — the local match index only stores
// lightweight pointers (no innings data), so standings genuinely need a real query. Two sources:
// this account's personal matches (a simple single-field equality query, scoped to the signed-in
// user already), and open sharedMatches (co-scored matches tagged with this tournament regardless
// of who's signed in). The shared side goes through /tournamentMatches/{tournamentId}/entries
// rather than a direct `sharedMatches.where("tournamentId", "==", ...)` query — see the Firestore
// rules comment on that collection for why: sharedMatches itself only allows `get` (exact doc by
// code), never `list`, so a match's full data can only ever be fetched one known code at a time.
// The pointer collection is what makes "find every shared match in this tournament" possible
// without that turning into "list every shared match that has ever existed." Also resolves any
// linked Super Over matches, since computeStandings needs those for points even though they're
// deliberately NOT tagged with the tournament themselves (that would double-count them as a
// separate played match).
async function loadTournamentMatches(tournamentId) {
  const byId = new Map();
  try {
    const entriesSnap = await db.collection("tournamentMatches").doc(tournamentId).collection("entries").get();
    const shareCodes = entriesSnap.docs.map(d => d.data().shareCode).filter(Boolean);
    const sharedDocs = await Promise.all(shareCodes.map(code => db.collection("sharedMatches").doc(code).get()));
    for (const doc of sharedDocs) {
      if (doc.exists) byId.set(doc.id, unpackMatchFromFirestore(doc.data()));
    }
  } catch (e) {
    console.error("tournament matches (shared) load failed", e);
  }
  if (auth.currentUser) {
    try {
      const snap = await db.collection("users").doc(auth.currentUser.uid).collection("matches").where("tournamentId", "==", tournamentId).get();
      for (const doc of snap.docs) {
        const m = unpackMatchFromFirestore(doc.data());
        byId.set(m.id, m);
      }
    } catch (e) {
      console.error("tournament matches (personal) load failed", e);
    }
  }
  const superOverIds = [...byId.values()].map(m => m.superOverMatchId).filter(Boolean).filter(id => !byId.has(id));
  if (superOverIds.length) {
    const linked = await Promise.all(superOverIds.map(id => loadMatch(id)));
    linked.forEach(m => {
      if (m) byId.set(m.id, m);
    });
  }
  return [...byId.values()];
}
// Standard single (or double) round-robin: every team plays every other team once, or twice with
// fixture order reversed for the return leg. Dates/times are deliberately left blank — a club
// tournament's actual scheduling (grounds, weekends, weather) rarely maps cleanly onto anything a
// generator could guess at anyway — but filled in later via a native datetime picker (FixtureRow)
// rather than free text, so they sort/display consistently.
function generateRoundRobinFixtures(teamNames, double) {
  const fixtures = [];
  for (let i = 0; i < teamNames.length; i++) {
    for (let j = i + 1; j < teamNames.length; j++) {
      fixtures.push({
        id: uid(),
        teamA: teamNames[i],
        teamB: teamNames[j],
        date: "",
        matchId: null
      });
      if (double) fixtures.push({
        id: uid(),
        teamA: teamNames[j],
        teamB: teamNames[i],
        date: "",
        matchId: null
      });
    }
  }
  return fixtures;
}
// tournament.groups, when set, is [{label, teams: [...]}, ...] in display order — a multi-pool
// tournament (e.g. "Group A" / "Group B", each playing round-robin only within itself, then a
// cross-group knockout) instead of one combined round-robin. Absent/null groups means the
// tournament behaves exactly as it always has — every function below that checks
// `tournament.groups` falls straight through to the original single-pool behavior otherwise, so
// this is fully backward compatible with every tournament created before groups existed.
//
// Generates round-robin fixtures WITHIN each group only (a team never meets a team from another
// group here — cross-group matches only happen in the knockout stage) — tags each fixture with
// its group's label so the fixture list and standings can partition by it later.
function generateGroupRoundRobinFixtures(groups, double) {
  const fixtures = [];
  for (const g of groups) {
    for (const f of generateRoundRobinFixtures(g.teams, double)) {
      fixtures.push({
        ...f,
        group: g.label
      });
    }
  }
  return fixtures;
}
function computeStandings(tournament, allMatches) {
  const byId = new Map(allMatches.map(m => [m.id, m]));
  const table = new Map(tournament.teams.map(name => [name, {
    team: name,
    played: 0,
    won: 0,
    lost: 0,
    tied: 0,
    points: 0,
    runsFor: 0,
    oversFor: 0,
    runsAgainst: 0,
    oversAgainst: 0
  }]));
  const tournamentMatches = allMatches.filter(m => m.tournamentId === tournament.id && m.status === "complete");
  for (const m of tournamentMatches) {
    const [i1, i2] = m.innings;
    if (!table.has(i1.battingTeam) || !table.has(i2.battingTeam)) continue; // team not in this tournament's roster — skip rather than guess
    let winner = null; // team name, or null for a tie/no-result
    if (i2.runs > i1.runs) winner = i2.battingTeam;else if (i1.runs > i2.runs) winner = i1.battingTeam;
    // A tie with a completed, decisive Super Over: follow the chain for points only.
    if (!winner && m.superOverMatchId) {
      const so = byId.get(m.superOverMatchId);
      if (so && so.status === "complete") {
        const [s1, s2] = so.innings;
        if (s2.runs > s1.runs) winner = s2.battingTeam;else if (s1.runs > s2.runs) winner = s1.battingTeam;
      }
    }
    const rowA = table.get(i1.battingTeam);
    const rowB = table.get(i2.battingTeam);
    rowA.played++;
    rowB.played++;
    // NRR convention: a side bowled out (or that simply completes its full quota) is credited with
    // the full overs ALLOTTED for the run-rate calculation, not just the balls it happened to face
    // — otherwise being bowled out cheaply would perversely IMPROVE a team's run rate.
    const wicketsLimit = m.isSuperOver ? 2 : 10;
    const oversA = i1.wickets >= wicketsLimit ? m.oversLimit : i1.legalBalls / (i1.ballsPerOver || 6);
    const oversB = i2.wickets >= wicketsLimit ? m.oversLimit : i2.legalBalls / (i2.ballsPerOver || 6);
    rowA.runsFor += i1.runs;
    rowA.oversFor += oversA;
    rowA.runsAgainst += i2.runs;
    rowA.oversAgainst += oversB;
    rowB.runsFor += i2.runs;
    rowB.oversFor += oversB;
    rowB.runsAgainst += i1.runs;
    rowB.oversAgainst += oversA;
    if (winner === i1.battingTeam) {
      rowA.won++;
      rowA.points += 2;
      rowB.lost++;
    } else if (winner === i2.battingTeam) {
      rowB.won++;
      rowB.points += 2;
      rowA.lost++;
    } else {
      rowA.tied++;
      rowB.tied++;
      rowA.points += 1;
      rowB.points += 1;
    }
  }
  return [...table.values()].map(r => ({
    ...r,
    nrr: r.oversFor > 0 && r.oversAgainst > 0 ? r.runsFor / r.oversFor - r.runsAgainst / r.oversAgainst : 0
  })).sort((a, b) => b.points - a.points || b.nrr - a.nrr);
}
// One standings table per group instead of one combined table — reuses computeStandings itself
// rather than re-deriving the points/NRR math, by handing it a "tournament" scoped to just that
// group's teams (same real tournament id, so match-tagging still resolves correctly; a restricted
// teams array so cross-group results — which only exist once the knockout stage starts — don't
// pollute a group's own table). Returns null when the tournament has no groups, so callers can use
// `computeGroupStandings(t, matches) || [{label: null, standings: computeStandings(t, matches)}]`
// as a uniform shape if they want to render single-pool and grouped tournaments the same way.
function computeGroupStandings(tournament, allMatches) {
  if (!tournament.groups || !tournament.groups.length) return null;
  return tournament.groups.map(g => ({
    label: g.label,
    standings: computeStandings({
      ...tournament,
      teams: g.teams
    }, allMatches)
  }));
}
// First-knockout-round pairing for a multi-group tournament: qualifier rank R from group i faces
// qualifier rank (advancePerGroup - 1 - R) from the NEXT group, cycling group order. For the
// standard 2-group case this produces exactly "Group A #1 vs Group B #2" and "Group B #1 vs Group
// A #2" — the same pattern most club and franchise tournaments use to keep each group's top two
// apart until later. For 3+ groups this cycles the same rule through every group in turn; it's a
// reasonable generalization but only the 2-group case is the one this was actually validated
// against, since that's the shape real requests for this feature have taken so far.
function crossGroupKnockoutPairs(groupStandings, advancePerGroup) {
  const n = groupStandings.length;
  const paired = new Set();
  const pairs = [];
  for (let i = 0; i < n; i++) {
    for (let rank = 0; rank < advancePerGroup; rank++) {
      const key = `${i}:${rank}`;
      if (paired.has(key)) continue;
      const teamA = groupStandings[i].standings[rank] && groupStandings[i].standings[rank].team;
      if (!teamA) continue;
      const otherGroup = (i + 1) % n;
      const otherRank = advancePerGroup - 1 - rank;
      const otherKey = `${otherGroup}:${otherRank}`;
      if (otherGroup === i || paired.has(otherKey)) continue;
      const teamB = groupStandings[otherGroup].standings[otherRank] && groupStandings[otherGroup].standings[otherRank].team;
      if (!teamB) continue;
      pairs.push([teamA, teamB]);
      paired.add(key);
      paired.add(otherKey);
    }
  }
  return pairs;
}
// Renders a decimal overs count (e.g. 15.667) as cricket's own overs.balls notation ("15.4") —
// NOT a decimal number, the digit after the point is a ball count from 0-5 (or 0 to
// ballsPerOver-1), so this must floor to the nearest legal ball rather than round.
function decimalOversToLabel(oversDecimal, ballsPerOver) {
  const b = ballsPerOver || 6;
  const totalBalls = Math.floor(oversDecimal * b + 1e-9); // epsilon guards against e.g. 3.9999997
  const whole = Math.floor(totalBalls / b);
  const balls = totalBalls % b;
  return `${whole}.${balls}`;
}
// The exact margin a team needs THIS match to finish with a higher NRR than a specified rival —
// assumes the two are tied on points once this match is done (the calculator only knows about
// NRR; points/qualification logic beyond that is on the person using it). `stats` is the team's
// standings row from computeStandings BEFORE this match (a live/in-progress match is naturally
// excluded already, since computeStandings only counts status:"complete" matches).
//
// The one thing that makes this tractable instead of a two-variable optimization: whichever side
// of the match is FIXED (the team's own overs faced, or the overs they bowled at their opponent)
// only has one free variable once you know who batted first — see the two branches below for why.
function computeQualificationTarget({
  stats,
  rivalNRR,
  battingFirst,
  oversLimit,
  knownRuns
}) {
  const RF = stats.runsFor,
    OF = stats.oversFor,
    RA = stats.runsAgainst,
    OA = stats.oversAgainst;
  const L = oversLimit;
  if (battingFirst) {
    // We set `knownRuns` batting first. Our own oversFor contribution is fixed at L (bowled out
    // or all overs used — batting first never ends early). Our opponent's oversAgainst
    // contribution against us is ALSO fixed at L, whether they're bowled out or bat out their
    // overs (the only way it wouldn't be L is if THEY win the chase early, which isn't this
    // scenario — we're solving for scenarios where WE win). So the only lever left is how many
    // runs we restrict them to.
    const R_A = knownRuns;
    const forRate = (RF + R_A) / (OF + L);
    const maxConcedeExact = (forRate - rivalNRR) * (OA + L) - RA;
    return {
      kind: "restrict",
      maxConcedeExact,
      maxConcede: Math.max(0, Math.ceil(maxConcedeExact) - 1),
      achievable: maxConcedeExact > 0
    };
  } else {
    // `knownRuns` is the target we're chasing (opponent's completed first-innings score). Their
    // contribution to our AGAINST side is fixed the moment their innings ends (runs = target,
    // overs = L, same reasoning as above — they either got bowled out or batted out their overs).
    // A winning chase always finishes the instant we pass the target, so our runs (R_A) are
    // pinned at target+1 — the one lever left is how many overs we take to get there.
    const target = knownRuns;
    const R_A = target + 1;
    const againstRate = (RA + target) / (OA + L);
    const requiredForRate = rivalNRR + againstRate;
    if (requiredForRate <= 0) {
      // Even a for-rate of 0 (technically impossible, but the threshold is non-positive) clears
      // it — any win at all, in any number of overs, is enough.
      return {
        kind: "chaseWithin",
        anyWinWorks: true,
        achievable: true
      };
    }

// ---------- Knockout stages (Quarterfinal / Semifinal / Final) ----------
// Winner of a completed match, following the Super Over chain for a tied match — same convention
// computeStandings uses for points. Returns the team name, or null if the match is unplayed, or
// still tied with no decisive Super Over yet (a knockout can't advance a team on that).
function matchWinner(m, matchById) {
  if (!m || m.status !== "complete" || !m.innings || !m.innings[1]) return null;
  const [i1, i2] = m.innings;
  if (i2.runs > i1.runs) return i2.battingTeam;
  if (i1.runs > i2.runs) return i1.battingTeam;
  if (m.superOverMatchId && matchById) {
    const so = matchById.get(m.superOverMatchId);
    if (so && so.status === "complete" && so.innings && so.innings[1]) {
      const [s1, s2] = so.innings;
      if (s2.runs > s1.runs) return s2.battingTeam;
      if (s1.runs > s2.runs) return s1.battingTeam;

}

// table — just how many of the completed fixtures each side has won, reusing matchWinner exactly
// the way the knockout bracket does for its own winner resolution. A winner name that doesn't
// match either series team (e.g. a team got renamed after the fixture was played) lands in
// `unresolved` rather than being silently miscounted toward either side.
function computeSeriesScore(series, allMatches) {
  const matchById = new Map(allMatches.map(m => [m.id, m]));

    winsB = 0,
    tied = 0,
    unresolved = 0,
    played = 0;
  for (const f of series.fixtures || []) {
    if (!f.matchId) continue;
    const m = matchById.get(f.matchId);
    if (!m || m.status !== "complete") continue;
    played++;
    const winner = matchWinner(m, matchById);
    if (winner === series.teamA) winsA++;else if (winner === series.teamB) winsB++;else if (winner) unresolved++;else tied++;
  }
  return {
    winsA,
    winsB,
    tied,
    unresolved,
    played,

}
// Standard single-elimination bracket sizes, largest first. Which ones apply to a given

// working down to a Final, 4-7 teams start at the Semifinal, 2-3 teams go straight to a Final,
// and fewer than 2 teams can't have a knockout stage at all.
const KNOCKOUT_STAGES = [{
  label: "Quarterfinal",
  size: 8

  label: "Semifinal",
  size: 4

  label: "Final",
  size: 2

function applicableKnockoutStages(teamCount) {

// Later stages don't need this: their teams are already in bracket order (the winners of
// consecutive pairs from the previous stage), so they just pair up sequentially.
const BRACKET_SEED_PAIRS = {
  8: [[0, 7], [3, 4], [1, 6], [2, 5]],
  4: [[0, 3], [1, 2]],
  2: [[0, 1]]
};

// Restores what exportUserData() produces: profile, teams, and personal matches, written back to

// doubles as an account-to-account migration as well as a same-account restore. Deliberately does
// NOT touch clubs: the export's `clubs` array is informational only (id/name/role), not a full
// club document, and clubs are shared state gated by Firestore rules (membership, ownership,
// rosters) — there's no safe way to "restore" a club from three fields without either creating a
// duplicate or silently granting membership nobody approved. Matches are re-packed for Firestore
// (the export ran them through unpackMatchFromFirestore) and written as a plain overwrite with a

// there's no conflict check to route around; a match id that already exists in the destination
// account is meant to be overwritten by the backup.

    return {
      ok: false,
      error: "That doesn't look like a Club Scorer backup file."

  }

  let matchesCount = 0;

      console.error("import: profile restore failed", e);
    }

    }

// ---------- Account data export & deletion ----------

// Deletes everything this account can reach, then the Firebase Auth account itself. localMatchIds
// lets the caller pass in whatever this device's own match index knows about — those go through
// the regular deleteMatch() so a shareCode/viewCode pair tied to a match gets cleaned up too,
// which a plain Firestore query by uid could never find (same ownerless-by-design limitation as
// exportUserData above). Matches only ever seen on a DIFFERENT device won't be reachable from
// here; that's a real limitation of the open-code sharing model, not an oversight.
async function deleteUserAccount(localMatchIds) {
  const uid = auth.currentUser.uid;
  for (const id of localMatchIds) {
    await deleteMatch(id);
  }
  const matchesSnap = await db.collection("users").doc(uid).collection("matches").get();
  await Promise.all(matchesSnap.docs.map(d => d.ref.delete().catch(e => console.error("delete account: match cleanup failed", e))));
  await db.collection("users").doc(uid).collection("meta").doc("teams").delete().catch(e => console.error("delete account: teams cleanup failed", e));
  await db.collection("users").doc(uid).collection("meta").doc("profile").delete().catch(e => console.error("delete account: profile cleanup failed", e));
  // Leave every club this account is a member of. Both memberUids AND coOwnerUids must be
  // cleared in the SAME write — the clubs/{clubId} update rule's self-leave branch (C) requires
  // both to change together; a memberUids-only write (as this used to do) fails that branch
  // whenever the departing member was also a co-owner, silently leaving them stuck in
  // coOwnerUids forever pointing at a now-deleted account. This can never touch ownerUid itself —
  // there is no self-service ownership transfer, so a club where this account was the SOLE owner
  // (no co-owners) becomes permanently unmanageable by anyone. AccountScreen warns about this
  // before deletion; there's no way to prevent it here after the fact.
  const clubsSnap = await db.collection("clubs").where("memberUids", "array-contains", uid).get();
  await Promise.all(clubsSnap.docs.map(d => d.ref.update({
    memberUids: firebase.firestore.FieldValue.arrayRemove(uid),
    coOwnerUids: firebase.firestore.FieldValue.arrayRemove(uid)
  }).catch(e => console.error("delete account: club leave failed", e))));
  // Same idea for federation co-ownership (federations have no separate "member" list — only
  // createdBy and coOwnerUids). Relies on the federations/{federationId} update rule's branch
  // (C) — if that hasn't been published to this Firestore project yet, this best-effort write
  // fails harmlessly (caught below) and the now-deleted account stays listed as a co-owner. A
  // federation this account CREATED (createdBy) can never be reassigned or removed — federations
  // can never be deleted at all (see the rule's `allow delete: if false`), so a federation whose
  // creator's account is gone stays exactly as owned/manageable as it was via any co-owner, but
  // permanently carries a dead createdBy uid with no way to ever change that.
  const fedSnap = await db.collection("federations").where("coOwnerUids", "array-contains", uid).get();
  await Promise.all(fedSnap.docs.map(d => d.ref.update({
    coOwnerUids: firebase.firestore.FieldValue.arrayRemove(uid)
  }).catch(e => console.error("delete account: federation co-owner cleanup failed", e))));
  try {
    await auth.currentUser.delete();
  } catch (e) {
    if (e.code === "auth/requires-recent-login") {
      // Firebase requires a fresh sign-in for account deletion specifically — reusing the same
      // sign-in flow (with its popup-blocked/redirect fallback already handled) rather than
      // duplicating that logic here.
      const reauth = await signInGoogle();
      if (!reauth.ok) throw e;
      await auth.currentUser.delete();
    } else {
      throw e;
    }
  }
}

function computePlayerStats(matches) {

  function get(name) {
    if (!players[name]) {
      players[name] = {
        name,
        runs: 0,
        balls: 0,
        dismissals: 0,
        battingInnings: 0,
        wickets: 0,
        ballsBowled: 0,
        runsConceded: 0,
        matchIds: new Set(),
        // Personal-best tracking — best single-innings knock/bowling figures, not career totals.
        bestBattingRuns: null,
        bestBattingOut: null,
        // whether THAT specific best innings ended not-out
        bestBowlingWickets: null,
        bestBowlingRuns: null,
        catches: 0

    if (!m || !m.innings) return;

        // dismissed one (matches the usual convention of listing the not-out score as the better
        // one when both are the same number of runs).
        const runs = b.runs || 0;

          p.bestBattingRuns = runs;

        // since fielderName isn't stored as its own field on the ball event — see applyBall's
        // wicket branch. Stumpings intentionally aren't counted here; they're a keeper's dismissal,
        // not a catch.

          const caughtMatch = b.how.match(/^c (.+) b .+$/);

          if (catcher) get(catcher).catches += 1;
        }

        const p = get(name);

        p.ballsBowled += bw.ballsBowled || 0;
        p.runsConceded += bw.runs || 0;
        p.matchIds.add(m.id);
        // Best bowling: most wickets wins outright; tied on wickets, fewer runs conceded wins —
        // the standard "best bowling figures" convention (e.g. 4/18 beats 4/32).
        const w = bw.wickets || 0,
          r = bw.runs || 0;

// Every match this device/account knows about that currently has an active score code and/or
// view link, with a revoke button for each — the account-level "what have I shared" overview that
// individual matches don't give you on their own.
// Curated, not exhaustive — this is for the handful of things a person genuinely wouldn't
// discover just by exploring the app (score code vs. view code, borrowing a player, the public
// club/federation directory, series vs. tournaments, retired hurt vs. out) rather than a full
// manual duplicating the README. Each entry stays to a couple of sentences, same register as the
// rest of the app's own inline copy — this isn't a different voice, just a dedicated place to
// find it. Keep this in sync with README.md and the first-launch tour whenever a covered feature
// changes; a stale help entry is worse than none, since it actively misleads instead of just
// not helping.
const HELP_SECTIONS = [{
  title: "Scoring",
  entries: [{
    q: "What does the powerplay badge actually do?",
    a: "It marks the window (however many overs you set at the start of an innings) — nothing more. There's no fielder-position tracking in the app, so it can't enforce a fielding restriction; it just shows a badge while you're in it."
  }, {
    q: "What happens when an innings goes over its time cap?",
    a: "Nothing gets stopped. Set a target in Match Rules and an \u201cOVER TIME\u201d badge shows up once an innings runs past it \u2014 it's a heads-up for whoever's scoring, not an enforced limit, since real innings overrun for all kinds of legitimate reasons the app has no way to judge."
  }, {
    q: "How does Free Hit work here?",
    a: "Turn it on in Match Rules. After a no-ball, only a run out counts as a dismissal until the next legal delivery — the app handles this automatically once it's on."
  }, {
    q: "What's the difference between retired hurt and retired out?",
    a: "Retired hurt doesn't count as a wicket and credits no bowler — use it for an injury or anything that pulls someone away mid-innings. Retired out counts exactly like a normal dismissal. Both are on the \u201cRetire\u201d button next to Swap Strike, and only apply to whoever's currently on strike."
  }, {
    q: "What happens if a match ties with Super Over on?",
    a: "A one-over eliminator decides it, same as international matches. Turn it on per match in Match Rules."
  }, {
    q: "How do I set up a 9-a-side (or other short-format) match?",
    a: "\u201cPlayers per side\u201d is on the Teams & Format step of setup (6\u201311, standard is 11). It controls how many players the Playing XI step asks you to select \u2014 set it before picking your XI, or a saved squad with more than 9 registered players would otherwise ask for a full 11."
  }]
}, {
  title: "Sharing & sync",
  entries: [{
    q: "Score code vs. view code \u2014 what's the difference?",
    a: "A score code (\u201cInvite to help score\u201d) gives full read-and-write scoring access \u2014 treat it like a shared password, only for someone you actually want scoring alongside you. A view code (\u201cShare live score\u201d) is read-only \u2014 anyone with the link can watch, nobody can edit, even if they have both codes."
  }, {
    q: "Do I need an account?",
    a: "No. Score codes and view codes work with no sign-in at all. Signing in with Google is only needed if you want your matches, teams, and clubs to follow you across devices."
  }, {
    q: "What does exporting/importing my data actually cover?",
    a: "Export (Account \u2192 Your data) gives you a JSON backup of your profile, teams, and matches saved to that account. Import restores it \u2014 into the same account, or a different one to migrate. It doesn't cover clubs (shared state, not personal data) or matches only ever shared via a score code."
  }]
}, {
