  noballRuns: 1,
  freeHit: false,
  maxOversPerBowler: null

  const bits = [];
  if (rules.ballsPerOver && rules.ballsPerOver !== DEFAULT_RULES.ballsPerOver) bits.push(`${rules.ballsPerOver}-ball overs`);
  if (rules.wideRuns && rules.wideRuns !== DEFAULT_RULES.wideRuns) bits.push(`${rules.wideRuns} runs on a wide`);
  if (rules.noballRuns && rules.noballRuns !== DEFAULT_RULES.noballRuns) bits.push(`${rules.noballRuns} runs on a no-ball`);
  if (rules.freeHit) bits.push("Free Hit enabled");

  return toss.decision ? `${toss.wonBy} won the toss, chose to ${toss.decision.toLowerCase()}` : `${toss.wonBy} won the toss`;
}
function matchResultText(match) {
  const [i1, i2] = match.innings;
  if (match.status !== "complete") return null;
  if (!i2) return null;
  if (i2.runs >= i1.runs + 1) {
    return `${i2.battingTeam} won by ${10 - i2.wickets} wicket${10 - i2.wickets === 1 ? "" : "s"}`;
  } else if (i2.runs === i1.runs) {
    return "Match tied";

function buildShareText(match) {

  const toss = tossText(match.toss);
  if (toss) lines.push(toss);
  match.innings.forEach(inn => {
    if (!inn.battingOrder || inn.battingOrder.length === 0) return;
    lines.push(`${inn.battingTeam}: ${inn.runs}-${inn.wickets} (${oversLabel(inn.legalBalls, inn.ballsPerOver)} ov)`);
  });
  if (match.status === "complete") {
    const result = matchResultText(match);
    if (result) lines.push(result);
    if (match.playerOfMatch) lines.push(`\u2B50 Player of the Match: ${match.playerOfMatch}`);
  }
  if (match.shareCode) lines.push(`Match code: ${match.shareCode}`);
  return lines.join("\n");
}

  }
}

  match.innings.forEach(inn => {

    lines.push(`${inn.battingTeam}: ${inn.runs}-${inn.wickets} (${oversLabel(inn.legalBalls, inn.ballsPerOver)} ov)`);
  });

function computePlayerStats(matches) {
  const players = {}; // name -> { runs, balls, dismissals, innings, wickets, ballsBowled, runsConceded, matches: Set }
  function get(name) {
    if (!players[name]) {
      players[name] = {
        name,
        runs: 0,
        balls: 0,
        dismissals: 0,
        battingInnings: 0,
        wickets: 0,
        ballsBowled: 0,
        runsConceded: 0,
        matchIds: new Set()
      };
    }
    return players[name];
  }
  matches.forEach(m => {
    if (!m || !m.innings) return;
    m.innings.forEach(inn => {
      Object.entries(inn.batsmen || {}).forEach(([name, b]) => {
        const p = get(name);
        p.runs += b.runs || 0;
        p.balls += b.balls || 0;
        p.battingInnings += 1;
        if (b.out) p.dismissals += 1;
        p.matchIds.add(m.id);
      });
      Object.entries(inn.bowlers || {}).forEach(([name, bw]) => {
        const p = get(name);
        p.wickets += bw.wickets || 0;
        p.ballsBowled += bw.ballsBowled || 0;
        p.runsConceded += bw.runs || 0;
        p.matchIds.add(m.id);
      });
    });
  });
  return Object.values(players).map(p => ({
    ...p,
    matchCount: p.matchIds.size,
    battingAvg: p.dismissals > 0 ? p.runs / p.dismissals : null,
    strikeRate: p.balls > 0 ? p.runs / p.balls * 100 : null,
    bowlingAvg: p.wickets > 0 ? p.runsConceded / p.wickets : null,
    economy: p.ballsBowled > 0 ? p.runsConceded / p.ballsBowled * 6 : null

}

  // simple, transparent heuristic: runs scored + 20 per wicket taken, combined across both innings
  const scores = {};
  match.innings.forEach(inn => {
    Object.entries(inn.batsmen || {}).forEach(([name, b]) => {
      scores[name] = (scores[name] || 0) + (b.runs || 0);
    });
    Object.entries(inn.bowlers || {}).forEach(([name, bw]) => {
      scores[name] = (scores[name] || 0) + (bw.wickets || 0) * 20;
    });
  });
  let best = null,
    bestScore = -1;
  Object.entries(scores).forEach(([name, s]) => {
    if (s > bestScore) {
      bestScore = s;
      best = name;
    }
  });
  return best;
}

  const names = new Set();
  match.innings.forEach(inn => {
    (inn.battingOrder || []).forEach(n => names.add(n));
    (inn.bowlingOrder || []).forEach(n => names.add(n));

// ---------- Ball event application ----------
// event: { kind: 'run'|'wide'|'noball'|'bye'|'legbye'|'wicket', runs, wicketType, newBatsman }
function applyBall(inning, event) {
  // Penalty runs (always exactly 5, per the Laws) aren't tied to any delivery — no ball bowled,
  // no batsman/bowler figures affected, no entry in the over's ball-by-ball log. Handled entirely
  // separately from the rest of the ball pipeline below.
  if (event.kind === "penalty") {
    return {
      ...inning,
      runs: inning.runs + event.runs,
      extras: {
        ...inning.extras,
        penalty: (inning.extras.penalty || 0) + event.runs
      }
    };
  }
  // Free hit: a non-run-out dismissal can't stand on a free-hit ball. Reroute it to a dot ball
  // rather than crediting the wicket — the UI also hides the disallowed wicket types while a
  // free hit is active, this is just a safety net.
  if (inning.freeHitActive && event.kind === "wicket" && event.wicketType !== "Run out") {
    event = {
      kind: "run",
      runs: 0
    };
  }
  const cur = {
    ...inning
  };
  cur.overs = cur.overs.map(o => [...o]);
  cur.batsmen = {
    ...cur.batsmen
  };
  cur.bowlers = {
    ...cur.bowlers
  };
  cur.extras = {
    ...cur.extras
  };
  ensureBatsman(cur, cur.strikerName);
  ensureBatsman(cur, cur.nonStrikerName);
  ensureBowler(cur, cur.bowlerName);
  const bowler = {
    ...cur.bowlers[cur.bowlerName]
  };
  let legalBall = true;
  let runsThisBall = 0;
  let display = "";
  let strikeChanges = false;
  if (event.kind === "run") {
    runsThisBall = event.runs;
    cur.runs += event.runs;
    cur.batsmen[cur.strikerName] = {
      ...cur.batsmen[cur.strikerName],
      runs: cur.batsmen[cur.strikerName].runs + event.runs,
      balls: cur.batsmen[cur.strikerName].balls + 1,
      fours: cur.batsmen[cur.strikerName].fours + (event.runs === 4 ? 1 : 0),
      sixes: cur.batsmen[cur.strikerName].sixes + (event.runs === 6 ? 1 : 0)
    };

    bowler.ballsBowled += 1;
    display = String(event.runs);
    if (event.runs % 2 === 1) strikeChanges = true;
  } else if (event.kind === "wide") {
    legalBall = false;
    runsThisBall = (cur.wideRuns || 1) + (event.runs || 0);
    cur.runs += runsThisBall;
    bowler.runs += runsThisBall;
    cur.extras.wide += runsThisBall;
    display = event.runs ? `Wd+${event.runs}` : "Wd";
    if ((event.runs || 0) % 2 === 1) strikeChanges = true;
  } else if (event.kind === "noball") {
    legalBall = false;
    runsThisBall = (cur.noballRuns || 1) + (event.runs || 0);
    cur.runs += runsThisBall;
    bowler.runs += runsThisBall;
    cur.extras.noball += 1;
    cur.batsmen[cur.strikerName] = {
      ...cur.batsmen[cur.strikerName],
      runs: cur.batsmen[cur.strikerName].runs + (event.runs || 0),
      fours: cur.batsmen[cur.strikerName].fours + (event.runs === 4 ? 1 : 0),
      sixes: cur.batsmen[cur.strikerName].sixes + (event.runs === 6 ? 1 : 0)
    };

    if (cur.freeHitEnabled) cur.freeHitActive = true;
  } else if (event.kind === "bye" || event.kind === "legbye") {
    runsThisBall = event.runs;
    cur.runs += event.runs;
    cur.extras[event.kind] += event.runs;
    cur.batsmen[cur.strikerName] = {
      ...cur.batsmen[cur.strikerName],
      balls: cur.batsmen[cur.strikerName].balls + 1
    };
